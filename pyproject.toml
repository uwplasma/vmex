[build-system]
# Pure-Python build: VMEX ships no compiled extensions, so installing it never
# requires a C/C++ toolchain.  All numerics are JAX.
requires = ["setuptools", "wheel", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "vmex"
version = "0.10.0"
description = "JAX implementation of VMEC2000 with differentiable fixed-boundary and branch-local free-boundary research paths."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Rogerio Jorge", email = "rogerio.jorge@wisc.edu"}]
license = "MIT"
keywords = ["vmec", "stellarator", "mhd", "jax", "optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "numpy",
  # 0.9.2 is the oldest JAX a CI lane tests (ci.yml jax-compatibility).
  # vmex/__init__.py refuses older jax/jaxlib/scipy at import with the same
  # floors.  jaxlib 0.9.x crashes loading large cached executables, so
  # vmex/_compat.py keeps the persistent cache off below 0.10.
  "jax>=0.9.2",
  "jaxlib>=0.9.2",
  # 1.16 added least_squares(callback=), which the optimization examples pass;
  # SciPy 1.16 needs Python 3.11, hence requires-python.
  "scipy>=1.16",
  "netCDF4",
  "h5py",
  "matplotlib",
  "packaging",
  # JAX's persistent compilation cache uses file locks across processes.
  "filelock",
  # 0.4.0 fixes registered-surface selection and rebuilding cached mode grids.
  # It retains 0.3.0's magnetic_only JAX projection for QI and the asymmetric
  # spectra/guarded zero-mode derivatives required by the field objectives.
  "booz_xform_jax>=0.4.0",
  # 0.21.0 is the first release whose tridiagonal_solve/tridiagonal_solve_checked
  # (the radial preconditioner's solves) run their Thomas sweeps through the
  # accelerator-batched scan (unroll=2 off CPU; the CPU sweep is unchanged).
  # Every other solvax API vmex calls (least-squares polishing, continuation,
  # GMRES/GCROT, block Thomas, SpluFactorization, chunk_map) has the same
  # signature from 0.20.0 through 0.24.0; 0.22-0.24 add only APIs vmex does
  # not call, so the floor stops at 0.21.0.
  "solvax>=0.21.0",
]

[project.scripts]
vmex = "vmex.core.cli:main"
vmec = "vmex.core.cli:main"  # alias

[project.urls]
Homepage = "https://github.com/uwplasma/vmex"
Documentation = "https://vmex.readthedocs.io/en/latest/"
Repository = "https://github.com/uwplasma/vmex"
Issues = "https://github.com/uwplasma/vmex/issues"
Changelog = "https://github.com/uwplasma/vmex/releases"

[project.optional-dependencies]
optimizers = [
  "jaxopt",
  "optax",
]
# Effective ripple through the independently validated NEO_JAX backend. It is
# optional so the equilibrium solver and default installation remain slim.
neoclassical = [
  "neo-jax>=1.0.2",
]
# Differentiable virtual casing on a specified boundary; this is not a NESTOR
# equilibrium adjoint. 0.0.7 is the newest release. The APIs vmex calls
# (ExteriorFieldConfig, VirtualCasingExteriorField with its surface-precision
# and near-surface plans, VmecSurfaceFieldData, and error_estimate's
# kst_error_estimate/boundary_series_from_gamma/density_magnitude_from_surface)
# are all present in 0.0.6 and 0.0.7 alike.
freeb = [
    "virtual-casing-jax>=0.0.7",
]
#
# Gyrokinetic turbulence-proxy objectives (``vmex.core.turbulence``) via GKX,
# uwplasma's JAX-native Hermite-Laguerre flux-tube gyrokinetic solver
# (https://github.com/uwplasma/GKX; PyPI name ``gkx`` — the package formerly
# published as ``spectraxgk``; 1.8.0 adds the tprim/fprim drive fields).
turbulence = [
  "gkx>=1.8.0",
  # gkx opts into reverse-mode eigenvector derivatives through
  # lax_linalg.eig(enable_eigvec_derivs=...), which first exists in
  # jax 0.10.1.  Below that the proxies raise TypeError at call time,
  # so carry gkx's own floor here rather than resolving to a jax that
  # imports but cannot run them.
  "jax>=0.10.1",
  "jaxlib>=0.10.1",
]
# 0.17 is the first release carrying uwplasma/ESSOS#58: Coils.from_json,
# Coils.with_dofs, the coil-separation and coil-surface-distance losses,
# surfacerzfourier_from_boundary and LevelsetStoppingCriterion. Every coil
# example uses that API, so 0.16 is not enough and there is no longer any
# reason to install ESSOS from git.
coils = [
  "essos>=0.17",
]
# Everything the examples and the documented workflows need, so a reader does
# not have to assemble the list themselves.
all = [
  "vmex[coils,freeb,neoclassical,optimizers,turbulence]",
]
docs = [
  "sphinx",
  "sphinx-copybutton",
  "furo",
  "myst-parser",
  "sphinx-design",
  "sphinxext-rediraffe",
]
dev = [
  "build",
  "furo",
  "mypy",
  "myst-parser",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxext-rediraffe",
  "types-setuptools",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vmex*"]
exclude = ["tests*", "docs*", "examples*", "tools*", "validation*", "results*", "build*", "dist*"]

[tool.setuptools.package-data]
vmex = ["resources/input.nfp4_QH_warm_start"]

[tool.pytest.ini_options]
markers = [
  "full: slower/full-physics tests; set RUN_FULL=1 to run",
  "weekly: high-resolution campaigns excluded from nightly CI",
  "gpu: tests that require a real GPU; skipped when no GPU is available",
  "vmec2000_live: opt-in integration tests requiring a local VMEC2000 executable",
]

[tool.coverage.run]
# virtual_casing.py requires the optional virtual-casing-jax >= 0.0.7
# extra (see [project.optional-dependencies]). Its FD-validated gradient
# tests are importorskip-gated and skip in the dependency-minimal core CI,
# so the module is excluded from the core >=95% coverage gate. It is
# exercised by the optional-integrations CI lane. turbulence.py is
# likewise gated on the optional ``turbulence`` extra (gkx).
omit = ["*/virtual_casing.py", "*/turbulence.py"]

[tool.coverage.report]
omit = ["*/virtual_casing.py", "*/turbulence.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff 0.16 changed its implicit default from the classic Pyflakes/pycodestyle
# baseline to every stable rule.  Keep VMEX's existing lint contract explicit
# so an unpinned developer-tool upgrade cannot reclassify the whole repository.
# D101/D102/D103: every public class, method, and function in the ``vmex``
#        package carries a docstring (pydocstyle visibility: names without a
#        leading underscore, honoring a module's ``__all__``; closures and
#        methods of private classes are not public).  The package was at zero
#        violations when this was enabled; the API reference renders these
#        docstrings, so a missing one is a documentation regression.
select = ["E4", "E7", "E9", "F", "D101", "D102", "D103"]
# E402: module-level import not at top-of-file.  Deferred imports (after env
#        setup / jax.config calls) are deliberate to control JAX initialisation.
# E501: line too long.  Handled by the line-length setting above; long lines in
#        ported Fortran-style code are acceptable.
# E702: semicolons as statement separators in tightly coupled numerical
#        kernels, common in ported Fortran code.
ignore = ["E402", "E501", "E702"]

[tool.ruff.lint.per-file-ignores]
# The docstring contract is on the package's public surface only.
"tests/**" = ["D"]
# The split polish modules import shared fixtures with the `as` re-export
# idiom and take them as test parameters; F811 for that pattern is a
# false positive that only some ruff versions report.
"tests/test_polish_homotopy.py" = ["D", "F811"]
"tests/test_polish_linear.py" = ["D", "F811"]
"examples/**" = ["D"]
"benchmarks/**" = ["D"]
"tools/**" = ["D"]
"docs/**" = ["D"]

[tool.mypy]
# Note: recent numpy stubs use PEP 695 `type` statements, so the checked
# python_version cannot be pinned below 3.12.
ignore_missing_imports = true
# With full defaults the core trips 38 errors in 11 files, all jax.Array /
# ndarray-typing false positives (mypy sees opaque jax.Array where numpy
# overloads are annotated).  Disabled codes shrunk from the legacy 14-code
# blanket to the 8 the core actually needs; name-defined, valid-type,
# call-arg, misc, type-arg, no-any-return and override are enabled again.
disable_error_code = ["operator", "union-attr", "assignment", "arg-type", "index", "return-value", "list-item", "attr-defined"]
