name: Docs linkcheck

# External-link audit of the docs tree:
# weekly, on demand, and on pull requests that touch docs/. Hosts that
# reject CI runners are pinned in `linkcheck_ignore` in docs/conf.py, each
# with its reason.

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 6"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-linkcheck.yml"

concurrency:
  group: docs-linkcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linkcheck:
    name: sphinx -b linkcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install ".[docs]"
      - name: Check external links
        run: |
          python -m sphinx -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: linkcheck-output
          path: docs/_build/linkcheck/output.txt
