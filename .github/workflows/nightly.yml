name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: Nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VMEX_COMPILATION_CACHE: disabled
  JAX_ENABLE_X64: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  optimization:
    name: ${{ matrix.campaign }} physics acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        campaign: [opt-qi, opt-qa, opt-qh, opt-qp]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install . pytest
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/vmex
          key: vmex-v5-${{ runner.os }}-nightly-${{ matrix.campaign }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: vmex-v5-${{ runner.os }}-nightly-${{ matrix.campaign }}-${{ hashFiles('pyproject.toml') }}-
      - name: Run bounded optimization campaign
        env:
          RUN_FULL: "1"
        run: |
          FILES="$(python tools/test_manifest.py select full-${{ matrix.campaign }})"
          pytest -q $FILES --durations=10 \
            --vmex-report="test-report-${{ matrix.campaign }}.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-report-${{ matrix.campaign }}
          path: test-report-${{ matrix.campaign }}.json
          if-no-files-found: warn
          retention-days: 7

  minimum-integrations:
    # floors: every declared floor pinned exactly -- latest-version jobs cannot
    # detect missing APIs at the floors. stale: an environment seeded with old
    # transitive dependencies, then `pip install ".[all]"` on top -- pip keeps
    # whatever satisfies a requirement, so a missing floor anywhere in the
    # stack (0.11.1 kept equinox 0.11.11 under jax 0.10) fails here, not on a
    # user's first run.
    name: Integrations (${{ matrix.install }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - install: floors
            python: "3.11"
          - install: stale
            python: "3.12"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install minimum integration versions
        if: matrix.install == 'floors'
        run: |
          python -m pip install ".[coils,turbulence,freeb,neoclassical]" pytest pytest-cov \
            jax==0.10.1 jaxlib==0.10.1 scipy==1.16.0 solvax==0.27.0 equinox==0.13.3 \
            booz_xform_jax==0.4.3 virtual-casing-jax==0.0.9 \
            essos==0.20.0 diffrax==0.7.0 neo-jax==1.0.5 gkx==2.5.0 dkx==2.8.0
      - name: Seed old dependencies, then install vmex[all] over them
        if: matrix.install == 'stale'
        run: |
          python -m pip install jax==0.5.0 jaxlib==0.5.0 equinox==0.11.11 \
            jaxtyping==0.2.36 diffrax==0.6.2 optimistix==0.0.10 lineax==0.0.7 \
            optax==0.2.3 jaxopt==0.8.3 numpy==1.26.4 scipy==1.14.1 \
            booz_xform_jax==0.1.1 solvax==0.20.0 virtual-casing-jax==0.0.2 \
            essos==0.16 neo-jax==1.0.1
          python -m pip install ".[all]" pytest pytest-cov
      - name: Check the resolved environment
        run: |
          python -m pip check
          python -m pip freeze
          python -c "import essos.dynamics, gkx, virtual_casing_jax, neo_jax, solvax, jaxopt, optax"
      - name: Solve and plot
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          cp "$GITHUB_WORKSPACE/examples/data/input.solovev" .
          vmex input.solovev --plot
          ls wout_solovev.nc solovev_summary.png
      - name: Check real integration calls and derivatives
        run: |
          pytest -q -o addopts= -o usefixtures=_module_jit_enabled \
            tests/test_virtual_casing_api.py \
            tests/test_virtual_casing_physics.py::test_synthetic_surface_gradient_fd_validates \
            tests/test_neoclassical.py::test_diagnostic_config_matches_converged_neo_on_the_qi_deck \
            tests/test_turbulence.py::test_drive_gradients_reach_gkx_as_a_over_l \
            tests/test_turbulence.py::test_growth_rate_gradient_matches_finite_differences \
            tests/test_examples.py::test_coil_examples_need_only_the_pinned_essos_release

  optional-integrations:
    name: Optional integrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install released optional integrations
        # neoclassical, optimizers and simsopt are installed by no other job, so
        # every effective-ripple, jaxopt/optax and simsopt-comparison test used
        # to skip in every lane -- which is how #354's aliased effective ripple
        # shipped.  This is the one job that exercises the released extras.
        run: |
          python -m pip install ".[coils,turbulence,freeb,neoclassical,optimizers]" \
            simsopt pytest pytest-xdist
      - name: Verify imports
        run: |
          python -c "import essos, gkx, virtual_casing_jax, neo_jax, jaxopt, optax"
          python -c "import simsopt"
      - name: Fetch reference assets
        run: python tools/fetch_assets.py --bundle reference-nc
      - name: Run integration contracts
        run: |
          FILES="$(python tools/test_manifest.py select optional)"
          pytest -q -n 2 -m "not full and not weekly" $FILES --durations=10 \
            --vmex-report=test-report-optional.json
      - name: Run direct-coil smoke
        env:
          RUN_FULL: "1"
        run: |
          pytest -q tests/test_examples.py::test_free_boundary_essos_coils \
            tests/test_examples.py::test_free_boundary_phiedge \
            --vmex-report=test-report-coils.json
      # NEO_JAX is installed above and nowhere else, so this is the only job
      # that can run the effective-ripple example at all.  The test is marked
      # ``full``, which the manifest selection above excludes, so it has never
      # executed anywhere -- ``pip install vmex[neoclassical]`` plus RUN_FULL=1
      # was the documented on-demand recipe and nothing automated it.  The
      # example takes about 90 s at its shipped settings; it has no cheaper
      # smoke path, because coarsening the NEO controls returns a profile that
      # no longer rises outward, which is the result it exists to show.
      - name: Run effective-ripple smoke
        env:
          RUN_FULL: "1"
        run: |
          pytest -q tests/test_examples.py::test_epsilon_effective_example \
            --vmex-report=test-report-ripple.json
      # The strong-force polish is too slow for the PR example lane (~2 min for
      # the solve, the polish, and both figure sets) but is the only run-level
      # check that the certificate the docs quote is still produced.
      - name: Run force-balance polishing smoke
        env:
          RUN_FULL: "1"
        run: |
          pytest -q tests/test_examples.py::test_force_balance_polishing_example \
            --vmex-report=test-report-polish.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-report-optional
          path: test-report-*.json
          if-no-files-found: warn
          retention-days: 7

  nonlinear-contracts:
    name: ${{ matrix.selector }} (JAX ${{ matrix.jax }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - selector: full-polish-gn
            jax: "0.11.1"
          - selector: full-run-options
            jax: "0.11.1"
          - selector: full-free-boundary-adjoint
            jax: "0.11.1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested numerical versions
        run: python -m pip install . pytest "jax==${{ matrix.jax }}" "jaxlib==${{ matrix.jax }}"
      - name: Add XLA compile headroom
        run: |
          sudo fallocate -l 12G /mnt/vmex-swap
          sudo chmod 600 /mnt/vmex-swap
          sudo mkswap /mnt/vmex-swap
          sudo swapon /mnt/vmex-swap
      - name: Fetch the free-boundary reference fixture
        if: matrix.selector == 'full-free-boundary-adjoint'
        run: |
          python tools/fetch_assets.py --bundle ncsx-mgrid
          test -f examples/data/mgrid_ncsx_c09r00_small.nc
      - name: Run retained nonlinear contracts
        env:
          RUN_FULL: "1"
          JAX_PLATFORMS: cpu
        run: |
          python -m pip freeze
          FILES="$(python tools/test_manifest.py select ${{ matrix.selector }})"
          pytest -q $FILES --durations=20 --vmex-report=nonlinear-report.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nonlinear-${{ matrix.selector }}-${{ matrix.jax }}
          path: nonlinear-report.json
          if-no-files-found: warn
          retention-days: 7
