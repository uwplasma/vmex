name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  # vmex's own default cache stays off here: shared by pytest -n workers, its
  # floor-0 writes each took JAX's cross-process eviction lock and serialized
  # the workers until every lane ran to its timeout (2026-08-31). The test
  # lanes instead carry a per-lane cache across runs (the xla-* steps below,
  # tools/ci_compile_cache.py): keyed on CPU, Python and jaxlib, one private
  # lock-free copy per pytest process, saved only by main.
  VMEX_COMPILATION_CACHE: disabled
  # Dependencies install with uv (no Actions cache: downloading is faster
  # than restoring pip's, and the 10 GB repository cache budget is kept for
  # compiled programs, which are what the lanes spend their time on).
  UV_SYSTEM_PYTHON: "1"

permissions:
  contents: read

jobs:
  changes:
    name: Select required CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
      run_coverage: ${{ steps.scope.outputs.run_coverage }}
      packaging: ${{ steps.packaging.outputs.changed }}
      parity: ${{ steps.parity.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only -z "origin/${GITHUB_BASE_REF}...HEAD" |
              python tools/ci_scope.py --null >> "$GITHUB_OUTPUT"
          else
            python tools/ci_scope.py --all </dev/null >> "$GITHUB_OUTPUT"
          fi
      - id: packaging
        # Installs break on packaging edits or new upstream releases, not on
        # ordinary code changes; the weekly workflow covers upstream releases.
        name: Detect packaging changes
        shell: bash
        run: |
          changed=false
          if [[ "${{ github.event_name }}" == "pull_request" ]] &&
             git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -qE '^(pyproject\.toml|MANIFEST\.in)$'; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - id: parity
        # Narrowing reuses the manifest ownership the lanes are built from.
        # Anything it cannot attribute returns every lane, so a miss costs
        # runner time and never coverage.
        name: Select the parity lanes this change needs
        shell: bash
        env:
          ALL: '[{"lane":"c2-mirror-eq","selector":"pr-parity-c2","parallel":"-n 4","serial":"pr-mirror-equilibrium","serial_parallel":""},{"lane":"misc-a-core","selector":"pr-examples pr-external pr-full-only pr-gradient-fd pr-parity-a2 pr-parity-b","parallel":"-n 4"},{"lane":"c6-gradient","selector":"pr-parity-c6 pr-gradient","parallel":"-n 4"},{"lane":"c3-c7","selector":"pr-parity-c3 pr-parity-c7","parallel":"-n 4"},{"lane":"a-free-c5","selector":"pr-parity-c5 pr-parity-e","parallel":"-n 4","serial":"pr-parity-a1","serial_parallel":"-n 2"},{"lane":"c4-mirror-spline","selector":"pr-parity-c4 pr-parity-f","parallel":"-n 4","serial":"pr-mirror-spline","serial_parallel":""},{"lane":"c1-d-mirror-field","selector":"pr-parity-c1 pr-parity-d","parallel":"-n 4","serial":"pr-mirror-field","serial_parallel":""}]'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only -z "origin/${GITHUB_BASE_REF}...HEAD" |
              python tools/ci_scope.py --null --matrix "$ALL" | grep '^matrix=' >> "$GITHUB_OUTPUT"
          else
            python tools/ci_scope.py --all --matrix "$ALL" </dev/null | grep '^matrix=' >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality, package, and docs
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install
        run: |
          uv pip install ".[dev]"
      - name: Check source, package, and docs
        run: |
          ruff check vmex tests examples tools
          mypy vmex
          python -m build
          python tools/check_docs_prose.py
          python -m sphinx -W -j auto -b html docs docs/_build/html

  fast:
    name: Fast API tests (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      XLA_LANE: fast
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install
        run: |
          uv pip install . pytest pytest-cov pytest-xdist
      - name: Check repository size
        run: |
          size_kb=$(du -sk --exclude=.git . | cut -f1)
          echo "working tree: ${size_kb} KiB"
          test "$size_kb" -lt 40960
      - name: Load the docs configuration
        # The `quality` job builds the docs on 3.12 only, so a 3.12+ construct
        # in docs/conf.py would break the docs build on the
        # declared floor with no job noticing. Executing conf.py needs no Sphinx.
        run: python -c "import runpy; runpy.run_path('docs/conf.py')"
      - &xla-key
        id: xla
        name: Fingerprint the XLA compilation cache
        run: |
          python tools/ci_compile_cache.py key >> "$GITHUB_OUTPUT"
          echo "VMEX_CI_COMPILATION_CACHE=$RUNNER_TEMP/xla-cache" >> "$GITHUB_ENV"
      - &xla-restore
        id: xla-restore
        # A lane restores the newest cache main saved for this CPU, Python and
        # jaxlib; entries are content-addressed, so a stale one is a miss.
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/xla-cache
          key: xla-v1-${{ env.XLA_LANE }}-${{ steps.xla.outputs.fingerprint }}-${{ hashFiles('vmex/**', 'tests/**') }}
          restore-keys: xla-v1-${{ env.XLA_LANE }}-${{ steps.xla.outputs.fingerprint }}-
      - &xla-prepare
        name: Prepare the XLA compilation cache
        run: python tools/ci_compile_cache.py prepare "$VMEX_CI_COMPILATION_CACHE"
      - name: Run fast tests
        env:
          JAX_ENABLE_X64: "1"
        run: |
          FILES="$(python tools/test_manifest.py select pr-fast)"
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pytest -q -n 4 -m "not full and not weekly" $FILES --durations=20 \
              --cov=vmex --cov-report=term
            mv .coverage coverage.fast
          else
            pytest -q -n 4 -m "not full and not weekly" $FILES --durations=20
          fi
      - &xla-collect
        id: xla-collect
        name: Keep the XLA cache entries this run used
        # Only main writes: one writer per key, and pull requests do not spend
        # the 10 GB repository cache budget on entries no other ref can read.
        if: success() && github.event_name == 'push' && steps.xla-restore.outputs.cache-hit != 'true'
        run: python tools/ci_compile_cache.py collect "$VMEX_CI_COMPILATION_CACHE" >> "$GITHUB_OUTPUT"
      - &xla-save
        if: success() && steps.xla-collect.outputs.entries > 0
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/xla-cache
          key: ${{ steps.xla-restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.python-version == '3.12'
        with:
          name: coverage-fast
          path: coverage.fast
          retention-days: 3

  parity:
    name: Manifest parity lane (${{ matrix.lane }})
    needs: changes
    if: >-
      needs.changes.outputs.run_tests == 'true' &&
      needs.changes.outputs.parity != '[]'
    runs-on: ubuntu-latest
    # Real polish and free-boundary adjoint solves run in Nightly. Keep the
    # PR partition bounded; a timeout is a failure, never a passing benchmark.
    # Seven lanes of 10-12 warm minutes each (2026-10-15); a cold compilation
    # cache roughly doubles a lane.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.parity) }}
    env:
      XLA_LANE: parity-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install
        run: |
          uv pip install ".[coils,turbulence,freeb]" pytest pytest-cov pytest-xdist
      - name: Add XLA compile headroom
        run: |
          sudo fallocate -l 12G /mnt/vmex-swap
          sudo chmod 600 /mnt/vmex-swap
          sudo mkswap /mnt/vmex-swap
          sudo swapon /mnt/vmex-swap
      - name: Fetch the golden digests
        run: python tools/fetch_assets.py --bundle golden-v1
      - *xla-key
      - *xla-restore
      - *xla-prepare
      - name: Run the manifest lanes
        env:
          JAX_ENABLE_X64: "1"
        # ``serial`` lanes are memory-heavy and run after the others with
        # their own worker count, appending to the same coverage file.
        run: |
          files() {
            for LANE in "$@"; do python tools/test_manifest.py select "$LANE"; done |
              tr ' ' '\n' | sort -u | tr '\n' ' '
          }
          pytest -q ${{ matrix.parallel }} -m "not full and not weekly" \
            $(files ${{ matrix.selector }}) --durations=20 --cov=vmex --cov-report=term
          if [[ -n "${{ matrix.serial }}" ]]; then
            pytest -q ${{ matrix.serial_parallel }} -m "not full and not weekly" \
              $(files ${{ matrix.serial }}) --durations=20 --cov=vmex --cov-append --cov-report=term
          fi
      - *xla-collect
      - *xla-save
      - name: Stash coverage
        run: mv .coverage coverage.parity-${{ matrix.lane }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-parity-${{ matrix.lane }}
          path: coverage.parity-${{ matrix.lane }}
          retention-days: 3

  device:
    name: Two-device placement and AD
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    # The lane ran 6:39-7:06 before the cross-device multigrid guard joined it
    # and hit the 10-minute cap at 10:17 with a heavier first draft of that
    # test.  The guard is now a two-iteration ladder, but a two-core runner has
    # little headroom left at 10.
    timeout-minutes: 15
    env:
      XLA_LANE: device
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install
        run: |
          uv pip install . pytest pytest-cov
      - *xla-key
      - *xla-restore
      - *xla-prepare
      - name: Run the forced two-device representatives
        env:
          JAX_ENABLE_X64: "1"
          XLA_FLAGS: "--xla_force_host_platform_device_count=2"
        run: |
          FILES="$(python tools/test_manifest.py select pr-device)"
          pytest -q $FILES --durations=10 --cov=vmex --cov-report=term
      - *xla-collect
      - *xla-save
      - name: Stash coverage
        run: mv .coverage coverage.device
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-device
          path: coverage.device
          retention-days: 3

  desc:
    # DESC-generated fixtures and CLI round trips take minutes, which the
    # 8-minute fast lane cannot hold; without DESC those tests skip there.
    name: DESC interoperability
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XLA_LANE: desc
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install
        run: uv pip install . 'desc-opt>=0.17' pytest pytest-cov pytest-xdist
      - *xla-key
      - *xla-restore
      - *xla-prepare
      - name: Run the DESC bridge tests
        env:
          JAX_ENABLE_X64: "1"
        run: |
          pytest -q -n 4 tests/test_desc.py --durations=10 --cov=vmex --cov-report=term
          mv .coverage coverage.desc
      - *xla-collect
      - *xla-save
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-desc
          path: coverage.desc
          retention-days: 3

  jax-compatibility:
    name: Stationarity contract (JAX ${{ matrix.jax }})
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        jax: ["0.9.2", "0.11.1"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install tested numerical versions
        run: uv pip install . pytest "jax==${{ matrix.jax }}" "jaxlib==${{ matrix.jax }}"
      - name: Record environment and exercise eager and compiled certificates
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: cpu
        run: |
          python -m pip freeze
          pytest -q -m "not full and not weekly" tests/test_polish.py --durations=10

  changed-coverage:
    name: Changed executable lines (>= 95%)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, fast, parity, device, desc]
    permissions:
      contents: read
      id-token: write
    if: >-
      always() &&
      needs.changes.outputs.run_coverage == 'true' &&
      needs.fast.result == 'success' &&
      needs.parity.result == 'success' &&
      needs.device.result == 'success' &&
      needs.desc.result == 'success'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - run: uv pip install coverage diff-cover
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage and enforce the mirror floor
        run: |
          coverage combine coverage.device coverage.desc coverage.fast coverage.parity-*
          coverage report --include='*/vmex/mirror/*' --fail-under=90
          coverage xml
      - name: Publish combined coverage
        uses: codecov/codecov-action@v5.5.5
        with:
          # OIDC upload 404s ("Repository not found") because the Codecov
          # project still carries the pre-rename vmec_jax identity, so the
          # upload authenticates with the repository token instead.  The
          # step stays best-effort either way: with fail_ci_if_error it
          # aborted this job BEFORE the changed-line gate below could run,
          # killing a local gate over a third-party outage.  The enforced
          # gates are the mirror floor above and diff-cover below; the
          # upload is telemetry.
          fail_ci_if_error: false
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch="origin/${GITHUB_BASE_REF}" --fail-under=95

  install:
    # One cheap Linux cell plus the two platforms CI never otherwise touches.
    name: pip install (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.extra }})
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", extra: ""}
          - {os: macos-latest, python: "3.13", extra: "[all]"}
          - {os: windows-latest, python: "3.13", extra: "[all]"}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install, import and run the CLI
        shell: bash
        run: |
          python -m pip install ".${{ matrix.extra }}"
          python -c "import vmex; vmex.configure(); print(vmex.__version__)"
          vmex --help > /dev/null

  pr-gate:
    name: PR gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, quality, fast, parity, desc, device, jax-compatibility, install, changed-coverage]
    steps:
      - name: Require every review gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
